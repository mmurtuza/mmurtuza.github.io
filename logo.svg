<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 120" role="img" aria-labelledby="logo-title" > 
 <title id="logo-title">murtuza.dev</title> 
 <defs> 
 <linearGradient id="badge-grad" x1="0" y1="0" x2="1" y2="1"> 
 <stop offset="0" stop-color="#22C7F0" /> 
 <stop offset="1" stop-color="#0087AD" /> 
 </linearGradient> 
 </defs> 

 <style> 
 :root { 
 --text-main: #0F172A; 
 --text-muted: #64748B; 
 } 
 @media (prefers-color-scheme: dark) { 
 :root { 
 --text-main: #E2E8F0; 
 --text-muted: #94A3B8; 
 } 
 } 

 .t-main { fill: var(--text-main); } 
 .t-dot { fill: #00ADD8; } 
 .t-muted { fill: var(--text-muted); } 

 @keyframes badgePop { 
 0% { opacity: 0; transform: scale(0.6); } 
 70% { opacity: 1; transform: scale(1.06); } 
 100% { opacity: 1; transform: scale(1); } 
 } 
 @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } } 
 @keyframes appear { from { opacity: 0; } to { opacity: 1; } } 
 @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } } 
 @keyframes fadeInUp { 
 from { opacity: 0; transform: translateY(16px); } 
 to { opacity: 1; transform: translateY(0); } 
 } 

 #badge { 
 transform-box: fill-box; 
 transform-origin: center; 
 animation: badgePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; 
 } 
 #prompt { 
 stroke-dasharray: 1; 
 animation: draw 0.45s ease-out 0.7s both; 
 } 
 #cursor { 
 animation: 
 appear 0.01s linear 1.2s both, 
 blink 1.1s step-end 1.5s infinite; 
 } 
 #wordmark { animation: fadeInUp 0.7s ease-out 1.0s both; } 

 @media (prefers-reduced-motion: reduce) { 
 #badge, #prompt, #cursor, #wordmark { animation: none; } 
 #prompt { stroke-dasharray: none; } 
 } 
 </style> 

 <g transform="translate(10, 10)"> 
 <rect id="badge" width="100" height="100" rx="24" fill="url(#badge-grad)" /> 
 <path id="prompt" pathLength="1" d="M 30 33 L 52 50 L 30 67" 
 fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /> 
 <rect id="cursor" x="58" y="63" width="20" height="9" rx="4.5" fill="#FF2D20" /> 
 </g> 

